name: Unit Tests

on:
  pull_request:
    branches:
      - dev
      - main

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Attention Analysis
            test-file: tests/test_attention_analysis.py
          - name: Chunked SIEVE Model
            test-file: tests/test_chunked_sieve.py
          - name: Co-occurrence Audit
            test-file: tests/test_cooccurrence_audit.py
          - name: Epistasis Power Analysis
            test-file: tests/test_epistasis_power.py
          - name: Fold Config Saving
            test-file: tests/test_fold_config_saving.py
          - name: Gene Interactions
            test-file: tests/test_gene_interactions.py
          - name: Genome Build
            test-file: tests/test_genome_build.py
          - name: Higher-Order Interactions
            test-file: tests/test_higher_order_interactions.py
          - name: Null Baseline
            test-file: tests/test_null_baseline.py
          - name: Phase 3 Explainability
            test-file: tests/test_phase3_explain.py
          - name: Ploidy-Aware Dosage
            test-file: tests/test_ploidy_aware_dosage.py
            system-deps: libcurl4-openssl-dev
          - name: Sex Covariate
            test-file: tests/test_sex_covariate.py
          - name: Utilities
            test-file: tests/test_utilities.py

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install system dependencies
        if: matrix.system-deps
        run: |
          sudo apt-get update
          sudo apt-get install -y ${{ matrix.system-deps }}

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Run tests
        run: pytest ${{ matrix.test-file }} -v --no-header -o "addopts="
        env:
          PYTHONPATH: ${{ github.workspace }}

  docs-drift:
    name: Docs Drift
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install assembler dependencies
        run: pip install "pyyaml>=6.0"

      - name: Reassemble USER_GUIDE.md from documentation/
        run: python scripts/assemble_user_guide.py

      - name: Fail if USER_GUIDE.md is out of date
        run: |
          if ! git diff --exit-code USER_GUIDE.md; then
            echo "::error::USER_GUIDE.md does not match documentation/."
            echo "documentation/ is the source of truth. Edit the page there, then run:"
            echo "  python scripts/assemble_user_guide.py"
            exit 1
          fi

      - name: Fail if any console entry point is undocumented
        run: python scripts/sync_command_table.py --check

      - name: Fail if the documented version is out of date
        run: python scripts/sync_docs_version.py --check

      - name: Check prose style (British English, no em dashes)
        run: python scripts/check_docs_style.py
